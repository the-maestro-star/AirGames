{%extends "base.html"%}
{%block title%}Rock Paper Scissors{%endblock%}
{%block stylesheet%}
<link rel="stylesheet" href="/static/rps.css">
{%endblock%}
{%block content%}
<div class = 'flex-container'>
    <a href = '{{url_for("home.index")}}'>Home</a>
    <a href = '{{url_for("games.index")}}'>Games</a>
    <a href = '{{url_for("games.index")}}'>About</a>
</div>

<div class = 'video-container'> 
    <video id="video" autoplay playsinline></video>
</div>

<canvas id='canvas'></canvas>
<p id = 'result'></p>
<p id = 'computer-result'></p>

<!--Scoreboard--> 
<div class="scoreboard">
    <div class="scores">
        <div class="score-box player">
            <div class="label">YOU</div>
            <div id="player-score" class="score">0</div>
        </div>
   
        <div class="score-box computer">
            <div class="label">COMPUTER</div>
            <div id="computer-score" class="score">0</div>
        </div>
    </div>
    <div class = 'choose-score' >Choose Winning Score Below</div>
    <span><button class = 'round-button' id='10'>10</button><button class="round-button" id = '15'>15</button><button class = 'round-button' id = '20'>20</button></span>
    <button class="play-game" id="play-game">
    Let's Play!
    </button>
    <button class = 'play-game' id = 'reset'>Reset</button>
</div>
<div id = 'countdown'></div>



<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="/static/rps.js"></script>

{%endblock%}
